[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rufpass"
version = "0.2.3"
description = "Automatische Rueckruf-Freigaben fuer die FRITZ!Box im eigenen Heimnetz"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Maximilian Glas"}]
dependencies = ["fritzconnection>=1.15.1,<2"]

[project.urls]
Repository = "https://github.com/maxglas/Rufpass"
Documentation = "https://github.com/maxglas/Rufpass/blob/main/docs/operations.md"
Issues = "https://github.com/maxglas/Rufpass/issues"

[project.scripts]
rufpass = "rufpass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
